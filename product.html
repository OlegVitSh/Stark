<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сварочный стол PRO 2000x1000 мм | СТАРК-ПРОФИ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: '#1E293B', light: '#334155', dark: '#0F172A' },
                        accent: { DEFAULT: '#EA580C', light: '#F97316', dark: '#C2410C' },
                        neutral: { DEFAULT: '#F8FAFC', light: '#FFFFFF', dark: '#E2E8F0' },
                    }
                }
            }
        }
    </script>
    <script src="js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/mask@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-neutral text-primary-dark antialiased" x-data>

    <!-- HEADER -->
    <header class="bg-primary-dark border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-accent flex items-center justify-center"><i class="fa-solid fa-fire text-white"></i></div>
                <span class="text-xl font-extrabold tracking-wide">СТАРК-ПРОФИ</span>
            </a>
            <nav class="hidden lg:flex items-center gap-8 text-sm">
                <a href="index.html" class="hover:text-accent">Главная</a>
                <a href="catalog.html" class="hover:text-accent">Каталог</a>
                <a href="technology.html" class="hover:text-accent">О технологии</a>
                <a href="delivery.html" class="hover:text-accent">Доставка</a>
                <a href="contacts.html" class="hover:text-accent">Контакты</a>
            </nav>
            <button @click="$store.app.openModal()" class="btn-glow bg-accent hover:bg-accent-light text-white text-xs font-semibold px-4 py-2.5 rounded">Запросить КП</button>
        </div>
    </header>

    <!-- PRODUCT DETAIL -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" x-data="{
        thickness: 12,
        nitriding: true,
        basePrice: 114000,
        get totalPrice() {
            let p = this.basePrice;
            if (this.thickness === 16) p += 32000;
            if (this.nitriding) p += 26000;
            return p.toLocaleString('ru-RU') + ' ₽';
        }
    }">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
            <!-- Визуальный блок / Чертеж -->
            <div class="lg:col-span-7 bg-white border border-slate-200 rounded-2xl p-8 flex flex-col items-center justify-center min-h-[380px] tabletop-holes">
                <i class="fa-solid fa-table-cells-large text-8xl text-slate-400/70 mb-4"></i>
                <span class="font-bold text-slate-800 text-lg">Сборочно-сварочный 3D-стол D28</span>
                <span class="text-xs text-slate-500">Координатная сетка 100х100 мм · 5 рабочих сторон с бортами 200 мм</span>
            </div>

            <!-- Конфигуратор и заказ -->
            <div class="lg:col-span-5 bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 flex flex-col gap-6">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-accent">Система D28 PRO</span>
                    <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Стол сварочный 2000 × 1000 мм</h1>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Толщина рабочей плиты</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" @click="thickness = 12" :class="thickness === 12 ? 'border-accent bg-orange-50 text-accent font-bold' : 'border-slate-300 text-slate-600'" class="border py-2.5 rounded-md text-sm text-center">12 мм (Стандарт)</button>
                        <button type="button" @click="thickness = 16" :class="thickness === 16 ? 'border-accent bg-orange-50 text-accent font-bold' : 'border-slate-300 text-slate-600'" class="border py-2.5 rounded-md text-sm text-center">16 мм (Heavy)</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Обработка поверхности</label>
                    <label class="flex items-center justify-between border border-slate-300 p-3 rounded-md cursor-pointer hover:border-accent">
                        <span class="text-sm font-medium text-slate-800">Плазменное азотирование</span>
                        <input type="checkbox" x-model="nitriding" class="w-4 h-4 text-accent focus:ring-accent">
                    </label>
                </div>

                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="text-xs text-slate-400 block">Итоговая стоимость</span>
                        <span class="text-2xl font-extrabold text-slate-900" x-text="totalPrice"></span>
                    </div>
                    <button @click="$store.app.openModal('D28 2000x1000')" class="btn-glow bg-accent hover:bg-accent-light text-white font-bold text-sm px-6 py-3 rounded-md transition-colors">
                        Заказать счет
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 py-6 text-center text-xs">
        © 2026 СТАРК-ПРОФИ. Все права защищены.
    </footer>

    <!-- MODAL WINDOW -->
    <div x-show="$store.app.isModalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" @click="$store.app.closeModal()"></div>
        <div class="relative w-full max-w-lg rounded-xl bg-white p-6 z-10">
            <h3 class="font-bold text-lg mb-4 text-slate-900">Запрос коммерческого предложения</h3>
            <button @click="$store.app.closeModal()" class="w-full bg-accent text-white font-bold py-2 rounded">Закрыть</button>
        </div>
    </div>

</body>
</html>

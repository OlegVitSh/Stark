<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог сварочных столов D16 и D28 | СТАРК-ПРОФИ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: '#1E293B', light: '#334155', dark: '#0F172A' },
                        accent: { DEFAULT: '#EA580C', light: '#F97316', dark: '#C2410C' },
                        neutral: { DEFAULT: '#F8FAFC', light: '#FFFFFF', dark: '#E2E8F0' },
                    }
                }
            }
        }
    </script>
    <script src="js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/mask@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-neutral text-primary-dark antialiased" x-data>

    <!-- HEADER -->
    <header class="bg-primary-dark border-b border-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-accent flex items-center justify-center"><i class="fa-solid fa-fire text-white"></i></div>
                <span class="text-xl font-extrabold tracking-wide">СТАРК-ПРОФИ</span>
            </a>
            <nav class="hidden lg:flex items-center gap-8 text-sm">
                <a href="index.html" class="hover:text-accent">Главная</a>
                <a href="catalog.html" class="text-accent font-semibold">Каталог</a>
                <a href="technology.html" class="hover:text-accent">О технологии</a>
                <a href="delivery.html" class="hover:text-accent">Доставка</a>
                <a href="contacts.html" class="hover:text-accent">Контакты</a>
            </nav>
            <button @click="$store.app.openModal()" class="btn-glow bg-accent hover:bg-accent-light text-white text-xs font-semibold px-4 py-2.5 rounded">Запросить КП</button>
        </div>
    </header>

    <!-- CATALOG FILTER & GRID -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" x-data="{
        selectedSystem: 'all',
        selectedTreatment: 'all',
        items: [
            { id: 1, title: 'Стол D16 1200x800', system: 'd16', thickness: '8 мм', price: '45 000 ₽', nitriding: false },
            { id: 2, title: 'Стол D16 PRO 1500x1000', system: 'd16', thickness: '10 мм', price: '68 000 ₽', nitriding: true },
            { id: 3, title: 'Стол D28 Classic 2000x1000', system: 'd28', thickness: '12 мм', price: '114 000 ₽', nitriding: false },
            { id: 4, title: 'Стол D28 PRO Азотированный 2000x1000', system: 'd28', thickness: '12 мм', price: '148 000 ₽', nitriding: true },
            { id: 5, title: 'Стол D28 Heavy 2400x1200', system: 'd28', thickness: '16 мм', price: '185 000 ₽', nitriding: true },
            { id: 6, title: 'Набор быстрозажимной оснастки D28 (18 предм.)', system: 'clamps', thickness: '—', price: '34 500 ₽', nitriding: true }
        ],
        get filteredItems() {
            return this.items.filter(item => {
                const matchSys = this.selectedSystem === 'all' || item.system === this.selectedSystem;
                const matchTreat = this.selectedTreatment === 'all' || (this.selectedTreatment === 'nitro' ? item.nitriding : !item.nitriding);
                return matchSys && matchTreat;
            });
        }
    }">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Каталог оборудования и оснастки</h1>
            <p class="text-sm text-slate-500 mt-1">Оборудование сертифицировано по ТУ завода с гарантией 24 месяца</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Сайдбар фильтров -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 h-fit flex flex-col gap-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Система отверстий</h3>
                    <div class="flex flex-col gap-2 text-sm text-slate-700">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="system" value="all" x-model="selectedSystem" class="text-accent focus:ring-accent"> Все системы
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="system" value="d16" x-model="selectedSystem" class="text-accent focus:ring-accent"> Система D16 (шаг 50 мм)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="system" value="d28" x-model="selectedSystem" class="text-accent focus:ring-accent"> Система D28 (шаг 100 мм)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="system" value="clamps" x-model="selectedSystem" class="text-accent focus:ring-accent"> Оснастка и зажимы
                        </label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Термообработка</h3>
                    <div class="flex flex-col gap-2 text-sm text-slate-700">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="treatment" value="all" x-model="selectedTreatment" class="text-accent focus:ring-accent"> Все покрытия
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="treatment" value="nitro" x-model="selectedTreatment" class="text-accent focus:ring-accent"> С плазменным азотированием
                        </label>
                    </div>
                </div>
            </div>

            <!-- Сетка товаров -->
            <div class="lg:col-span-3">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="item in filteredItems" :key="item.id">
                        <div class="card-equipment bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-[11px] font-bold uppercase bg-slate-100 px-2 py-0.5 rounded text-slate-700" x-text="item.system.toUpperCase()"></span>
                                    <span x-show="item.nitriding" class="text-[10px] font-bold bg-orange-100 text-orange-700 px-2 py-0.5 rounded">Азотирование</span>
                                </div>
                                <h3 class="font-bold text-slate-900 text-base mb-2" x-text="item.title"></h3>
                                <p class="text-xs text-slate-500 mb-4">Толщина столешницы: <span class="font-semibold text-slate-800" x-text="item.thickness"></span></p>
                            </div>
                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                <span class="text-base font-extrabold text-slate-900" x-text="item.price"></span>
                                <a href="product.html" class="bg-accent hover:bg-accent-light text-white text-xs font-semibold px-3 py-2 rounded transition-colors">Купить</a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 py-6 text-center text-xs">
        © 2026 СТАРК-ПРОФИ. Все права защищены.
    </footer>

    <!-- MODAL WINDOW -->
    <div x-show="$store.app.isModalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" @click="$store.app.closeModal()"></div>
        <div class="relative w-full max-w-lg rounded-xl bg-white p-6 z-10">
            <h3 class="font-bold text-lg mb-4 text-slate-900">Запрос коммерческого предложения</h3>
            <button @click="$store.app.closeModal()" class="w-full bg-accent text-white font-bold py-2 rounded">Закрыть</button>
        </div>
    </div>

</body>
</html>
